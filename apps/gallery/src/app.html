<!doctype html>
<!-- lang 占位符由 hooks.server.ts 的 transformPageChunk 替换，别在别处再写这个 token -->
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0C0C0B" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- 图片淡入依赖 JS；没有 JS 时 Picture 直接显示图片，见 Picture.svelte -->
		<script>document.documentElement.classList.add('js');</script>
		<!-- 带 data-async-css 的样式表（Noto Sans SC）先以 media=print 低优先级下载、不阻塞渲染；
		     等页面主要资源加载完、浏览器空闲时才切成 all。切换后浏览器才会去下载用到的中文字体分片，
		     这样它们不会和首屏图片抢带宽。 -->
		<script>
			addEventListener('load', function () {
				(window.requestIdleCallback || setTimeout)(function () {
					document.querySelectorAll('link[data-async-css]').forEach(function (el) {
						el.media = 'all';
					});
				});
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
