<!doctype html>
<!-- lang 占位符由 hooks.server.ts 的 transformPageChunk 替换，别在别处再写这个 token -->
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0C0C0B" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- 图片淡入依赖 JS；没有 JS 时 Picture 直接显示图片，见 Picture.svelte -->
		<script>document.documentElement.classList.add('js');</script>
		<!-- 带 data-async-css 的样式表先以 media=print 下载（不阻塞渲染），加载完切成 all -->
		<script>
			document.addEventListener(
				'load',
				function (e) {
					var el = e.target;
					if (el.tagName === 'LINK' && el.hasAttribute('data-async-css')) el.media = 'all';
				},
				true
			);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
